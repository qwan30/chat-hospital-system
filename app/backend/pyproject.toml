[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-powered hospital knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "boto3>=1.34.0,<2.0.0",
  "fastapi>=0.95.0,<0.100.0",
  "httpx>=0.27.0",
  "pydantic>=1.10.0,<2.0.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.8.0",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn>=0.30.0",
  "cryptography>=41.0.0",
  "pymupdf>=1.24.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20.0",
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "opentelemetry-instrumentation-httpx>=0.41b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
  "prometheus-client>=0.17.0",
  "prometheus-fastapi-instrumentator>=6.0.0",
  "tenacity>=8.0.0",
  "setuptools<70.0.0",
  "numpy<2.0.0"
]

[project.optional-dependencies]
guardrails = [
  "llm-guard>=0.3.0",
  "openlit>=1.20.0",
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0"
]
dev = [
  "aiosqlite>=0.20.0",
  "PyYAML>=6.0.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]
postgres = [
  "asyncpg>=0.29.0",
  "pgvector>=0.3.0"
]
ocr = [
  "paddleocr>=3.0.0,<4.0.0",
  "paddlepaddle>=3.2.0,<4.0.0"
]
tables = [
  "pdfplumber>=0.10.0"
]
reranker = [
  "sentence-transformers>=2.2.0"
]
jwt-rs256 = [
  "cryptography>=41.0.0"
]
cohere = [
  "cohere>=5.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# Package name rather than path so it resolves identically whether the suite is
# run from a src-layout checkout or an installed wheel (CI passes --cov=hospital_ai).
source = ["hospital_ai"]
branch = true
omit = [
  "*/__pycache__/*",
  # Optional-dependency shims and worker entrypoints are exercised by the
  # deployment, not the unit suite; measuring them only adds noise.
  "*/workers/run_worker.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007", "UP045"]
