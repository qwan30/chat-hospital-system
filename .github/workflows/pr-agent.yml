name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  issue_comment:
    types:
      - created

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event.pull_request != null || github.event.issue.pull_request != null) && (github.event.pull_request.draft == false || github.event_name == 'issue_comment') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: PR Agent Action
        uses: the-pr-agent/pr-agent@v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.DEEPSEEK_KEY }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY || secrets.DEEPSEEK_KEY }}
          OPENAI__API_BASE: "https://api.deepseek.com/v1"
          CONFIG__MODEL: "deepseek/deepseek-chat"
