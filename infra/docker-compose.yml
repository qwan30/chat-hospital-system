# Hospital AI — Dokploy/VPS Docker Compose Stack
#
# The public ingress is Dokploy's Traefik. The frontend is deployed on Vercel;
# this stack owns the API, worker, database, cache, and temporary storage only.
# Usage from the repository root with an immutable image supplied by Dokploy:
#   BACKEND_IMAGE=ghcr.io/<owner>/hospital-ai-backend:sha-<7-hex> docker compose -f infra/docker-compose.yml up -d
# For observability, use the separate overlay only after VPS resource testing.

x-backend-environment: &backend-environment
  # Database
  HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hospital_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital_ai}
  HOSPITAL_AI_REDIS_URL: redis://redis:6379/0

  # Storage: R2 is the durable production source; the volume is temporary/cache state.
  HOSPITAL_AI_STORAGE_ROOT: /data/storage
  HOSPITAL_AI_STORAGE_BACKEND: ${HOSPITAL_AI_STORAGE_BACKEND:-r2}
  HOSPITAL_AI_R2_ENDPOINT: ${HOSPITAL_AI_R2_ENDPOINT}
  HOSPITAL_AI_R2_BUCKET: ${HOSPITAL_AI_R2_BUCKET}
  HOSPITAL_AI_R2_REGION: ${HOSPITAL_AI_R2_REGION:-auto}
  HOSPITAL_AI_R2_ACCESS_KEY_ID: ${HOSPITAL_AI_R2_ACCESS_KEY_ID}
  HOSPITAL_AI_R2_SECRET_ACCESS_KEY: ${HOSPITAL_AI_R2_SECRET_ACCESS_KEY}

  # Vercel frontend → Dokploy API domain.
  HOSPITAL_AI_CORS_ORIGINS: ${HOSPITAL_AI_CORS_ORIGINS:-https://app.example.com}
  HOSPITAL_AI_ENVIRONMENT: ${HOSPITAL_AI_ENVIRONMENT:-staging}

  # External providers. Ollama is intentionally not part of this deployment.
  HOSPITAL_AI_EMBEDDING_PROVIDER: ${HOSPITAL_AI_EMBEDDING_PROVIDER:-gemini}
  HOSPITAL_AI_EMBEDDING_DIMENSIONS: ${HOSPITAL_AI_EMBEDDING_DIMENSIONS:-1024}
  HOSPITAL_AI_CHAT_PROVIDER: ${HOSPITAL_AI_CHAT_PROVIDER:-gemini}
  HOSPITAL_AI_EMBEDDING_MODEL: ${HOSPITAL_AI_EMBEDDING_MODEL:-gemini-embedding-2}
  HOSPITAL_AI_GEMINI_API_KEY: ${HOSPITAL_AI_GEMINI_API_KEY}
  HOSPITAL_AI_GEMINI_CHAT_MODEL: ${HOSPITAL_AI_GEMINI_CHAT_MODEL:-gemini-2.0-flash}

  # OpenAI-compatible contract for an explicit DeepSeek chat deployment.
  # Task 1 freezes configuration only; application-level automatic fallback is not enabled.
  HOSPITAL_AI_OPENAI_API_KEY: ${HOSPITAL_AI_OPENAI_API_KEY}
  HOSPITAL_AI_OPENAI_BASE_URL: ${HOSPITAL_AI_OPENAI_BASE_URL:-https://api.deepseek.com/v1}
  HOSPITAL_AI_OPENAI_CHAT_MODEL: ${HOSPITAL_AI_OPENAI_CHAT_MODEL:-deepseek-chat}
  HOSPITAL_AI_OPENAI_EMBEDDING_MODEL: ${HOSPITAL_AI_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  HOSPITAL_AI_RETRIEVAL_MODE: ${HOSPITAL_AI_RETRIEVAL_MODE:-vector}
  HOSPITAL_AI_EVIDENCE_THRESHOLD: ${HOSPITAL_AI_EVIDENCE_THRESHOLD:-0.0}

  # Worker
  HOSPITAL_AI_WORKER_INLINE: "${HOSPITAL_AI_WORKER_INLINE:-false}"

  # HMS integration
  HOSPITAL_AI_HMS_BASE_URL: ${HOSPITAL_AI_HMS_BASE_URL:-http://host.docker.internal:8080/api/v1}
  HOSPITAL_AI_HMS_API_KEY: ${HOSPITAL_AI_HMS_API_KEY}
  HOSPITAL_AI_HMS_SYNC_ENABLED: "${HOSPITAL_AI_HMS_SYNC_ENABLED:-false}"
  HOSPITAL_AI_HMS_SYNC_TIMEOUT_SECONDS: "${HOSPITAL_AI_HMS_SYNC_TIMEOUT_SECONDS:-30}"

  # HMS JWT/OIDC. Production uses RS256/JWKS and fails closed when invalid.
  HOSPITAL_AI_JWT_ISSUER: ${HOSPITAL_AI_JWT_ISSUER}
  HOSPITAL_AI_JWT_AUDIENCE: ${HOSPITAL_AI_JWT_AUDIENCE}
  HOSPITAL_AI_JWKS_URL: ${HOSPITAL_AI_JWKS_URL}
  HOSPITAL_AI_JWT_HMAC_SECRET: ${HOSPITAL_AI_JWT_HMAC_SECRET}
  HOSPITAL_AI_JWT_ALGORITHM: ${HOSPITAL_AI_JWT_ALGORITHM:-RS256}

services:
  # ── PostgreSQL 16 + pgvector ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_ai}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host port: only backend/worker reach PostgreSQL through the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_ai} -d ${POSTGRES_DB:-hospital_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Redis 7 (job queue + cache) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    mem_limit: 256m
    # No host port: only backend/worker reach Redis through the Compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Chatbot Backend (FastAPI) ────────────────────────────────────
  backend:
    # Dokploy must inject the exact immutable candidate image.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable GHCR image reference}
    mem_limit: 768m
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - storage-data:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── RQ Background Worker (document processing) ────────────────────
  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable GHCR image reference}
    mem_limit: 1024m
    command: python -m hospital_ai.workers.run_worker
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/data/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
