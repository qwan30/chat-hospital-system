# Top-level Docker Compose for the AI-Powered Hospital Knowledge Assistant
# Runs: chatbot backend, PostgreSQL+pgvector, Redis, and optionally HMS.

services:
  # ── Shared database ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital_ai
      POSTGRES_PASSWORD: hospital_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_ai -d hospital_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Chatbot Backend (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: ./app/backend
    environment:
      HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://hospital_ai:hospital_ai@postgres:5432/hospital_ai
      HOSPITAL_AI_REDIS_URL: redis://redis:6379/0
      HOSPITAL_AI_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      HOSPITAL_AI_EMBEDDING_PROVIDER: deterministic
      HOSPITAL_AI_CHAT_PROVIDER: stub
      HOSPITAL_AI_HMS_BASE_URL: http://host.docker.internal:8080/api/v1
      HOSPITAL_AI_HMS_SYNC_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ── Chatbot Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: ./app/frontend
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
