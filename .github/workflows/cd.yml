name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose configuration to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/apps/chatbot-hospital"

      - name: SSH and deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/apps/chatbot-hospital

            # Log in to GHCR on the target machine
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export image prefix for docker-compose variable substitution
            export IMAGE_PREFIX="${{ github.repository_owner }}/hospital-ai"

            # Pull the pre-built backend image from GHCR
            docker compose pull backend

            # Start infrastructure services first (they must be healthy for migrations)
            docker compose up -d --wait postgres redis

            # Run database migrations
            docker compose run --rm backend alembic upgrade head

            # Bring up backend (and any remaining services)
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f
