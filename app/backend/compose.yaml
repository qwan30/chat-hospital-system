services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital_ai
      POSTGRES_PASSWORD: hospital_ai
    ports:
      - "5432:5432"
    volumes:
      - hospital_ai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_ai -d hospital_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hospital_ai_pg:
