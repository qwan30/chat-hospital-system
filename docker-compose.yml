# Docker Compose for the AI-Powered Hospital Knowledge Assistant
# Local Lite stack (16GB RAM) — doc 07 §3
# Usage: docker compose up --build

services:
  # -- PostgreSQL 16 + pgvector ------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital_ai
      POSTGRES_PASSWORD: hospital_ai
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_ai -d hospital_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # -- Redis 7 -------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -- Chatbot Backend (FastAPI) ------------------------------------
  backend:
    image: ghcr.io/${IMAGE_PREFIX:-qwan30/hospital-ai}-backend:main
    # `build` is used locally; `image` is used when pulling from GHCR in CD
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    environment:
      HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://hospital_ai:hospital_ai@postgres:5432/hospital_ai
      HOSPITAL_AI_REDIS_URL: redis://redis:6379/0
      HOSPITAL_AI_STORAGE_ROOT: /data/storage
      HOSPITAL_AI_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8082,http://127.0.0.1:8082
      HOSPITAL_AI_ENVIRONMENT: local
      HOSPITAL_AI_EMBEDDING_PROVIDER: deterministic
      HOSPITAL_AI_CHAT_PROVIDER: stub
      HOSPITAL_AI_WORKER_INLINE: "true"
      HOSPITAL_AI_HMS_BASE_URL: http://host.docker.internal:8080/api/v1
      HOSPITAL_AI_HMS_SYNC_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - storage-data:/data/storage

volumes:
  postgres-data:
  storage-data:
