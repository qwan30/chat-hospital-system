services:
  # -- PostgreSQL 16 + pgvector ------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital_ai
      POSTGRES_PASSWORD: hospital_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_ai -d hospital_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default

  # -- Redis 7 -------------------------------------------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  # -- Chatbot Backend (FastAPI) ------------------------------------
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    environment:
      HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://hospital_ai:hospital_ai@postgres:5432/hospital_ai
      HOSPITAL_AI_REDIS_URL: redis://redis:6379/0
      HOSPITAL_AI_STORAGE_ROOT: /data/storage
      HOSPITAL_AI_WORKER_INLINE: "true"
      HOSPITAL_AI_HMS_SYNC_ENABLED: "false"
      HOSPITAL_AI_CORS_ORIGINS: ${HOSPITAL_AI_CORS_ORIGINS:-https://chat-hospital.quanmariodev.id.vn,http://localhost:3000,*}
      HOSPITAL_AI_ENVIRONMENT: ${HOSPITAL_AI_ENVIRONMENT:-production}
      HOSPITAL_AI_GEMINI_API_KEY: ${HOSPITAL_AI_GEMINI_API_KEY}
      HOSPITAL_AI_EMBEDDING_PROVIDER: ${HOSPITAL_AI_EMBEDDING_PROVIDER:-gemini}
      HOSPITAL_AI_CHAT_PROVIDER: ${HOSPITAL_AI_CHAT_PROVIDER:-gemini}
      HOSPITAL_AI_GEMINI_CHAT_MODEL: ${HOSPITAL_AI_GEMINI_CHAT_MODEL:-gemini-2.0-flash}
      HOSPITAL_AI_DEV_BEARER_TOKENS: ${HOSPITAL_AI_DEV_BEARER_TOKENS}
      HOSPITAL_AI_DEMO_MODE: ${HOSPITAL_AI_DEMO_MODE:-false}
      HOSPITAL_AI_DEMO_JWT_SECRET: ${HOSPITAL_AI_DEMO_JWT_SECRET}
      HOSPITAL_AI_DEMO_JWT_ISSUER: ${HOSPITAL_AI_DEMO_JWT_ISSUER:-hospital-ai-demo}
      HOSPITAL_AI_DEMO_TOKEN_TTL_MINUTES: ${HOSPITAL_AI_DEMO_TOKEN_TTL_MINUTES:-30}
      HOSPITAL_AI_JWT_SECRET: ${HOSPITAL_AI_JWT_SECRET:-supersecretjwt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_ai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/data/storage
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.hospital-backend.rule=Host(`api-chat-hospital.quanmariodev.id.vn`)"
      - "traefik.http.routers.hospital-backend.entrypoints=websecure"
      - "traefik.http.routers.hospital-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.hospital-backend.loadbalancer.server.port=8000"

volumes:
  postgres-data:
  storage-data:

networks:
  dokploy-network:
    external: true
