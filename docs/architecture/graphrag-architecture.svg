<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">SQL-backed GraphRAG architecture</title>
  <desc id="desc">A hand-drawn style view of document chunks projected into GraphEntity and GraphRelation SQL rows, then traversed with patient-scoped breadth-first search to enrich retrieval and graph visualization.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#374151" stroke-width="2"/></marker></defs>
  <rect x="12" y="12" width="1076" height="626" rx="24" fill="#fffdf7" stroke="#a855f7" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="52" y="58" font-family="Comic Sans MS, Segoe Print, cursive" font-size="28" font-weight="700" fill="#1f2937">GraphRAG Architecture</text>
  <text x="52" y="88" font-family="Comic Sans MS, Segoe Print, cursive" font-size="16" fill="#6b7280">A SQL-backed entity graph with provenance and patient-scoped traversal — no dedicated graph database required</text>

  <rect x="52" y="132" width="212" height="90" rx="18" fill="#fff0c2" stroke="#f59e0b" stroke-width="3"/>
  <text x="158" y="165" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">Ready document chunks</text>
  <text x="158" y="192" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">text + source provenance</text>
  <rect x="300" y="132" width="212" height="90" rx="18" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="406" y="165" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">Entity extraction</text>
  <text x="406" y="192" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">production NLP / offline mode</text>
  <rect x="548" y="132" width="212" height="90" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="654" y="165" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">Graph projection</text>
  <text x="654" y="192" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">GraphEntity + GraphRelation</text>
  <rect x="796" y="132" width="252" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="922" y="165" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">SQL persistence</text>
  <text x="922" y="192" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">PostgreSQL / SQLite + source IDs</text>
  <path d="M264 177 H300 M512 177 H548 M760 177 H796" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="90" y="292" width="250" height="112" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="215" y="326" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">Clinical query</text>
  <text x="215" y="353" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">extract terms / entities</text>
  <text x="215" y="376" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">patient + role scope</text>
  <rect x="390" y="292" width="300" height="112" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="540" y="326" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">Scoped BFS traversal</text>
  <text x="540" y="353" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">normalized names • max_hops = 2</text>
  <text x="540" y="376" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">exclude invalid / deleted chunks</text>
  <rect x="740" y="292" width="270" height="112" rx="18" fill="#d9f5f7" stroke="#0891b2" stroke-width="3"/>
  <text x="875" y="326" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700">Related evidence</text>
  <text x="875" y="353" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">chunk IDs + graph summary</text>
  <text x="875" y="376" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="14">returned to permissioned RAG</text>
  <path d="M922 222 V260 H215 V292" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M340 348 H390 M690 348 H740" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="90" y="474" width="920" height="94" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="116" y="508" font-family="Comic Sans MS, Segoe Print, cursive" font-size="18" font-weight="700" fill="#c2410c">Two consumers, one provenance boundary</text>
  <text x="116" y="536" font-family="Comic Sans MS, Segoe Print, cursive" font-size="15" fill="#374151">Chat stream uses graph chunk IDs as optional enrichment; the patient graph endpoint exposes persisted nodes/edges for visualization.</text>
  <text x="116" y="558" font-family="Comic Sans MS, Segoe Print, cursive" font-size="15" fill="#374151">GraphRAG can be skipped when extraction/traversal fails; it must never bypass the downstream permission-scoped retrieval filter.</text>
  <text x="90" y="606" font-family="Comic Sans MS, Segoe Print, cursive" font-size="13" fill="#6b7280">Evidence: services/graph_rag.py • api/routes/graph.py • api/routes/chat_stream.py</text>
</svg>
