name: Scheduled Security Scan

on:
  schedule:
    # Every Monday at 06:00 UTC (after Dependabot runs)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Stage 1: Dependency vulnerability scanning
  # ═══════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Frontend: npm audit ──────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Dependency audit (high severity threshold)
        working-directory: app/frontend
        run: bun audit --audit-level=high || true
        continue-on-error: true

      # ── Backend: pip-audit ───────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit vulnerability scan
        working-directory: app/backend
        run: pip-audit
        continue-on-error: true

      # ── Backend: Bandit SAST ─────────────────────────────────────
      - name: Install backend dependencies + bandit
        working-directory: app/backend
        run: |
          pip install -e ".[postgres]" bandit

      - name: Bandit security analysis (advisory)
        working-directory: app/backend
        run: bandit -r src/ -ll -f screen || true

  # ═══════════════════════════════════════════════════════════════════
  # Stage 2: Secret detection (TruffleHog)
  # ═══════════════════════════════════════════════════════════════════
  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history for deep scan)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@v3.88.20
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ═══════════════════════════════════════════════════════════════════
  # Stage 3: Container image vulnerability scan
  # ═══════════════════════════════════════════════════════════════════
  container-scan:
    name: Scan published container images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/${{ github.repository }}/backend:latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-scheduled.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload Trivy scan results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-scheduled.sarif
          category: trivy-scheduled

  # ═══════════════════════════════════════════════════════════════════
  # Stage 4: Security scan summary (always runs)
  # ═══════════════════════════════════════════════════════════════════
  scan-summary:
    name: Security scan summary
    runs-on: ubuntu-latest
    needs: [dependency-review, secret-scan, container-scan]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Generate summary report
        run: |
          echo "## 🔒 Weekly Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scan | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency Review (pip-audit + npm audit + Bandit) | ${{ needs.dependency-review.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Detection (TruffleHog) | ${{ needs.secret-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container Scan (Trivy) | ${{ needs.container-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📋 [View full security alerts](${{ github.server_url }}/${{ github.repository }}/security)" >> "$GITHUB_STEP_SUMMARY"
