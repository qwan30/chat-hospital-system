name: Dokploy rollback handoff

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Dokploy environment to roll back"
        required: true
        type: choice
        options:
          - staging
          - production
      backend-tag:
        description: "Immutable backend tag, for example sha-abc1234"
        required: true
        type: string
      source-sha:
        description: "Full source SHA represented by the rollback image"
        required: true
        type: string
      confirm:
        description: "Type ROLLBACK to confirm this action"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate rollback request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check confirmation and immutable identity
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          BACKEND_TAG: ${{ inputs.backend-tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "ROLLBACK" ]] || { echo "::error::Type ROLLBACK to confirm"; exit 1; }
          [[ "$BACKEND_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || {
            echo "::error::backend-tag must be an immutable sha-<hex> tag"; exit 1;
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source-sha must be a full 40-character lowercase commit SHA"; exit 1;
          }

      - name: Verify rollback image exists in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect rollback image
        shell: bash
        env:
          BACKEND_TAG: ${{ inputs.backend-tag }}
        run: |
          set -euo pipefail
          docker manifest inspect "ghcr.io/${{ github.repository_owner }}/hospital-ai-backend:${BACKEND_TAG}" > /dev/null

  rollback:
    name: Invoke Dokploy rollback hook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.DOKPLOY_APP_URL || '' }}
    env:
      DOKPLOY_ROLLBACK_HOOK_URL: ${{ secrets.DOKPLOY_ROLLBACK_HOOK_URL }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      BACKEND_TAG: ${{ inputs.backend-tag }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - name: Require configured rollback hook
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOKPLOY_ROLLBACK_HOOK_URL" ]]; then
            echo "::error::DOKPLOY_ROLLBACK_HOOK_URL is not configured for this environment"
            echo "Configure the hook and rerun the rollback; no rollback was requested."
            exit 1
          fi

      - name: Trigger Dokploy rollback hook
        shell: bash
        env:
          DOKPLOY_ROLLBACK_HOOK_URL: ${{ secrets.DOKPLOY_ROLLBACK_HOOK_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          BACKEND_TAG: ${{ inputs.backend-tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/hospital-ai-backend:${BACKEND_TAG}"
          payload=$(printf '{"action":"rollback","environment":"%s","image":"%s","image_tag":"%s","source_sha":"%s","repository":"%s","workflow_run_id":"%s"}' \
            "$TARGET_ENVIRONMENT" "$IMAGE_REF" "$BACKEND_TAG" "$SOURCE_SHA" "$REPOSITORY" "$WORKFLOW_RUN_ID")
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$DOKPLOY_ROLLBACK_HOOK_URL"
          {
            echo "## Dokploy rollback hook accepted"
            echo "- Environment: ${TARGET_ENVIRONMENT}"
            echo "- Backend image: ${IMAGE_REF}"
            echo "- Source SHA: ${SOURCE_SHA}"
            echo "Verify the public health endpoint, worker queue, migrations, and error rate in Dokploy before restoring traffic."
          } >> "$GITHUB_STEP_SUMMARY"
