services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital_ai
      POSTGRES_PASSWORD: hospital_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_ai -d hospital_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://hospital_ai:hospital_ai@postgres:5432/hospital_ai
      HOSPITAL_AI_REDIS_URL: redis://redis:6379/0
      HOSPITAL_AI_STORAGE_ROOT: /data/storage
      HOSPITAL_AI_WORKER_INLINE: "true"
      HOSPITAL_AI_EMBEDDING_PROVIDER: deterministic
      HOSPITAL_AI_CHAT_PROVIDER: stub
      HOSPITAL_AI_CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-storage:/data/storage
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "hospital_ai.workers.run_worker"]
    environment:
      HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://hospital_ai:hospital_ai@postgres:5432/hospital_ai
      HOSPITAL_AI_REDIS_URL: redis://redis:6379/0
      HOSPITAL_AI_STORAGE_ROOT: /data/storage
      HOSPITAL_AI_EMBEDDING_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-storage:/data/storage
    restart: unless-stopped

  frontend:
    build:
      context: ../../app/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:8082"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  backend-storage:
