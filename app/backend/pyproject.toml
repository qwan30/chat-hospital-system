[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-powered hospital knowledge assistant."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.95.0,<0.100.0",
  "httpx>=0.27.0",
  "pydantic>=1.10.0,<2.0.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0"
]
lint = [
  "ruff>=0.6.0"
]
postgres = [
  "asyncpg>=0.29.0",
  "pgvector>=0.3.0"
]
ocr = [
  "paddleocr>=3.0.0"
]
tables = [
  "pdfplumber>=0.10.0"
]
reranker = [
  "sentence-transformers>=2.2.0"
]
cohere = [
  "cohere>=5.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
