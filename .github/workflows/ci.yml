name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/hospital-ai

jobs:
  # ===================================================================
  # STAGE 1 — FAST FEEDBACK (parallel, no dependencies)
  # Runs first to give quick pass/fail on code quality.
  # ===================================================================

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Verify infrastructure images are pullable
        run: |
          docker pull pgvector/pgvector:pg16
          docker pull redis:7-alpine

  # ===================================================================
  # STAGE 2 — TESTS & SECURITY (depends on lint passing)
  # ===================================================================

  backend-test:
    needs: backend-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hospital_ai
          POSTGRES_PASSWORD: hospital_ai
          POSTGRES_DB: hospital_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Run tests
        env:
          HOSPITAL_AI_DATABASE_URL: "postgresql+asyncpg://hospital_ai:hospital_ai@localhost:5432/hospital_ai_test"
          HOSPITAL_AI_CHAT_PROVIDER: "stub"
          HOSPITAL_AI_EMBEDDING_PROVIDER: "deterministic"
        run: python -m pytest tests/ -v --tb=short -q

      - name: Verify API contracts
        run: python scripts/verify_contracts.py

  backend-security:
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]" bandit pip-audit
      - name: Bandit security scan (advisory)
        run: bandit -r src/ -ll -f screen || true
      - name: Dependency vulnerability audit (advisory)
        run: pip-audit || true

  infra-migration-check:
    needs: backend-lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hospital_ai
          POSTGRES_PASSWORD: hospital_ai
          POSTGRES_DB: hospital_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]"

      - name: Apply Alembic migrations
        env:
          HOSPITAL_AI_DATABASE_URL: "postgresql+asyncpg://hospital_ai:hospital_ai@localhost:5432/hospital_ai_test"
        run: alembic upgrade head
      - name: Check migration-model alignment (advisory)
        env:
          HOSPITAL_AI_DATABASE_URL: "postgresql+asyncpg://hospital_ai:hospital_ai@localhost:5432/hospital_ai_test"
        run: alembic check || true

  # ===================================================================
  # STAGE 3 — DOCKER BUILD & PUSH
  # Only runs if ALL tests pass. Only pushes on push/tag, not PR.
  # ===================================================================

  docker-build-push:
    needs: [backend-test, backend-security, infra-migration-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ===================================================================
  # STAGE 3b — CI SUMMARY (always runs, reports overall status)
  # ===================================================================

  ci-summary:
    needs: [docker-build-push, infra-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect job statuses
        env:
          LINT: "${{ needs.backend-lint.result }}"
          TEST: "${{ needs.backend-test.result }}"
          SECURITY: "${{ needs.backend-security.result }}"
          MIGRATION: "${{ needs.infra-migration-check.result }}"
          DOCKER: "${{ needs.docker-build-push.result }}"
          INFRA: "${{ needs.infra-validate.result }}"
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "backend-lint:         ${LINT}"
          echo "backend-test:         ${TEST}"
          echo "backend-security:     ${SECURITY}"
          echo "infra-migration-check: ${MIGRATION}"
          echo "docker-build-push:    ${DOCKER}"
          echo "infra-validate:       ${INFRA}"
          echo "========================="

          if [ "${LINT}" != "success" ] || \
             [ "${TEST}" != "success" ] || \
             [ "${SECURITY}" != "success" ] || \
             [ "${MIGRATION}" != "success" ] || \
             [ "${DOCKER}" != "success" ] || \
             [ "${INFRA}" != "success" ]; then
            echo "::error::One or more CI jobs failed — check logs above."
            exit 1
          fi
          echo "All CI jobs passed."
