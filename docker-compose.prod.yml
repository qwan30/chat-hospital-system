services:
  # -- PostgreSQL 16 + pgvector ------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospital_ai
      POSTGRES_USER: hospital_ai
      POSTGRES_PASSWORD: hospital_ai
    # No ports exposed to outside, backend will connect internally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_ai -d hospital_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # -- Redis 7 -------------------------------------------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -- Chatbot Backend (FastAPI) ------------------------------------
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    # Removed env_file to prevent missing file error. Dokploy will inject from its UI.
    environment:
      HOSPITAL_AI_DATABASE_URL: postgresql+asyncpg://hospital_ai:hospital_ai@postgres:5432/hospital_ai
      HOSPITAL_AI_REDIS_URL: redis://redis:6379/0
      HOSPITAL_AI_STORAGE_ROOT: /data/storage
      HOSPITAL_AI_WORKER_INLINE: "true"
      HOSPITAL_AI_HMS_SYNC_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/data/storage
    labels:
      - "traefik.enable=true"
      # IMPORTANT: Replace YOUR_BACKEND_DOMAIN below with your actual API domain (e.g. api-chat-hospital.quanmariodev.id.vn)
      - "traefik.http.routers.hospital-backend.rule=Host(`api-chat-hospital.quanmariodev.id.vn`)"
      - "traefik.http.routers.hospital-backend.entrypoints=websecure"
      - "traefik.http.routers.hospital-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.hospital-backend.loadbalancer.server.port=8000"

volumes:
  postgres-data:
  storage-data:
